<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cho-Pilot 확인 필요</title>
  <link rel="stylesheet" href="/review.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">CHO-PILOT</p><h1>확인 필요</h1><p class="subtitle">시스템이 이해한 업무를 빠르게 확인해 주세요.</p></div>
    <div class="identity"><label>사용자 <input id="user" autocomplete="username"></label><button id="reload" class="quiet">새로고침</button></div>
  </header>
  <main>
    <section id="summary" class="summary" aria-live="polite"></section>
    <section id="empty" class="empty" hidden><span class="check">✓</span><h2>모두 확인했습니다</h2><p>새로운 확인 항목이 생기면 여기에 표시됩니다.</p></section>
    <section id="task" class="card" hidden>
      <div class="card-head"><div><span id="screen" class="screen"></span><h2 id="business"></h2></div><span id="confidence" class="confidence"></span></div>
      <p class="prompt">Cho-Pilot은 아래와 같이 이해했습니다.</p>
      <div id="fields" class="fields"></div>
      <div id="edit" class="edit" hidden>
        <label>틀린 항목<select id="element"></select></label>
        <label>올바른 업무 개념<select id="concept"></select></label>
        <label>이유<select id="reason"><option value="wrong_concept">업무 개념이 달라요</option><option value="wrong_context">화면 맥락이 달라요</option><option value="privacy">개인정보로 보여요</option><option value="other">기타</option></select></label>
        <label class="scope"><input id="org" type="checkbox"> 조직에도 같은 보정을 제안</label>
        <div class="edit-actions"><button id="cancel" class="quiet">취소</button><button id="submit" class="primary">수정 반영</button></div>
      </div>
      <div id="actions" class="actions"><button id="defer" class="quiet">나중에</button><button id="correct" class="secondary">틀린 항목 고치기</button><button id="accept" class="primary">나머지는 맞아요</button></div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="/review.js" defer></script>
</body>
</html>
